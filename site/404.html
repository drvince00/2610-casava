<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — CASSAVA CHIP</title>
<!-- Cloudflare Pages 는 없는 주소에 이 파일을 404 상태로 보여준다. 어느 깊이의 주소에서도 열리므로 경로는 모두 / 로 시작 -->
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Luckiest+Guy&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .nf { min-height: calc(100vh - 80px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 48px 20px 64px; text-align: center; }
  .nf-face { width: 150px; height: 150px; transform: rotate(-8deg); }
  .nf-code { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(88px, 22vw, 150px); line-height: .9; letter-spacing: 4px; color: var(--red); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 8px 8px 0 var(--ink); }
  .nf-msg { margin: 6px 0 0; font-family: var(--f-gothic); font-weight: 700; font-size: var(--fs-lead); line-height: 1.5; }
  .nf-msg span { display: block; }
  .nf-msg [lang="ja"] { font-family: 'Noto Sans JP', 'Noto Sans KR', sans-serif; }
  .nf-msg [lang="en"] { font-family: var(--f-body-latin), sans-serif; }
  .nf-home { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 10px 30px; background: var(--red); color: #fff; border: 4px solid var(--ink); border-radius: 999px; box-shadow: 6px 6px 0 var(--ink); font-family: var(--f-display); font-size: 26px; letter-spacing: 1px; text-decoration: none; }
  .nf-home:hover { color: #fff; transform: translate(2px, 2px); box-shadow: 4px 4px 0 var(--ink); }
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a href="/" class="logo" aria-label="CASSAVA CHIP home">CASSAVA CHIP</a>
  </div>
</header>

<main class="nf">
  <img class="nf-face" src="/favicon.svg" width="150" height="150" alt="">
  <h1 class="nf-code">404</h1>
  <p class="nf-msg">
    <span lang="ko">페이지를 찾을 수 없어요.</span>
    <span lang="ja">ページが見つかりません。</span>
    <span lang="en">Page not found.</span>
  </p>
  <a class="nf-home" href="/">HOME</a>
</main>
</body>
</html>

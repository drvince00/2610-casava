<!doctype html>
<html lang="ko" data-font-set="pop" data-scale="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASAVA CHIP — Crispy cassava chips from Cebu</title>
<meta name="description" content="세부에서 만나는 바삭한 카사바칩 CASAVA CHIP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 폰트 세트 A(Retro Pop) + 설명용 굵은 고딕. B/C 세트를 쓰려면 PRD.md 4-2 참고해 패밀리 추가 -->
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Dela+Gothic+One&family=Fredoka:wght@400;600;700&family=Gowun+Dodum&family=Luckiest+Guy&family=M+PLUS+Rounded+1c:wght@400;700&family=Noto+Sans+JP:wght@700;900&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="top"></div>

<header class="site-header">
  <div class="container header-row">
    <a href="#top" class="logo" aria-label="CASAVA CHIP home">CASAVA CHIP</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="ko" aria-label="한국어" aria-pressed="true">
        <svg width="34" height="23" viewBox="0 0 36 24" aria-hidden="true"><rect width="36" height="24" fill="#fff" stroke="#ccc" stroke-width="1"/><path d="M12 12A6 6 0 0 1 24 12A3 3 0 0 1 18 12A3 3 0 0 0 12 12Z" fill="#CD2E3A"/><path d="M12 12A6 6 0 0 0 24 12A3 3 0 0 0 18 12A3 3 0 0 1 12 12Z" fill="#0047A0"/><g stroke="#1b1b1b" stroke-width="1.4"><path d="M4 5L8 2"/><path d="M5 6.5L9 3.5"/><path d="M6 8L10 5"/><path d="M28 2L32 5"/><path d="M27 3.5L31 6.5"/><path d="M26 5L30 8"/><path d="M4 19L8 22"/><path d="M5 17.5L9 20.5"/><path d="M6 16L10 19"/><path d="M28 22L32 19"/><path d="M27 20.5L31 17.5"/><path d="M26 19L30 16"/></g></svg>
      </button>
      <button type="button" class="lang-btn" data-lang="ja" aria-label="日本語" aria-pressed="false">
        <svg width="34" height="23" viewBox="0 0 36 24" aria-hidden="true"><rect width="36" height="24" fill="#fff" stroke="#ccc" stroke-width="1"/><circle cx="18" cy="12" r="7" fill="#BC002D"/></svg>
      </button>
      <button type="button" class="lang-btn" data-lang="en" aria-label="English" aria-pressed="false">
        <svg width="34" height="23" viewBox="0 0 36 24" aria-hidden="true"><rect width="36" height="24" fill="#fff"/><g fill="#B22234"><rect y="0" width="36" height="2"/><rect y="4" width="36" height="2"/><rect y="8" width="36" height="2"/><rect y="12" width="36" height="2"/><rect y="16" width="36" height="2"/><rect y="20" width="36" height="2"/></g><rect width="16" height="12" fill="#3C3B6E"/><g fill="#fff"><circle cx="4" cy="3" r="1"/><circle cx="8" cy="3" r="1"/><circle cx="12" cy="3" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/><circle cx="4" cy="9" r="1"/><circle cx="8" cy="9" r="1"/><circle cx="12" cy="9" r="1"/></g></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <!-- 1. Hero: 01 Crunch Time 이미지 고정 -->
  <section class="hero">
    <h1 class="sr-only">CASAVA CHIP</h1>
    <figure class="ad-frame">
      <img src="images/01-crunch-time.png" width="1080" height="1080" alt="CRUNCH TIME! — CASAVA CHIP" fetchpriority="high">
    </figure>
  </section>

  <!-- 2. 슬라이드 + 카사바 설명 -->
  <section class="slides-section">
    <div class="container center">
      <h2 class="section-title" data-i18n="slideTitle"></h2>
      <p class="lead bold-gothic" data-i18n="slideLead"></p>
    </div>
    <div class="marquee" aria-label="Gallery">
      <div class="marquee-track">
        <!-- 이미지 교체: images/slides/ 의 파일만 바꾸면 됨. 아래 4장은 JS가 자동으로 한 번 더 복제해 무한 루프를 만든다 -->
        <img class="slide" src="images/slides/slide-01.png" width="1080" height="1080" alt="" loading="lazy">
        <img class="slide" src="images/slides/slide-02.png" width="1080" height="1080" alt="" loading="lazy">
        <img class="slide" src="images/slides/slide-03.png" width="1080" height="1080" alt="" loading="lazy">
        <img class="slide" src="images/slides/slide-04.png" width="1080" height="1080" alt="" loading="lazy">
      </div>
    </div>

    <div class="container">
      <div class="about-card bold-gothic">
        <h3 class="about-title" data-i18n="aboutTitle"></h3>
        <p class="about-intro" data-i18n="aboutIntro"></p>
        <div class="benefits-title" data-i18n="benefitsTitle"></div>
        <div class="benefits">
          <div class="benefit" style="--card:#FFE9B0">
            <span class="benefit-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/><path d="M9 15l2 2 4-4"/></svg></span>
            <div class="benefit-title" data-i18n="b1t"></div>
            <div class="benefit-body" data-i18n="b1"></div>
          </div>
          <div class="benefit" style="--card:#FFD9CF">
            <span class="benefit-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9"/><path d="M12 13c-2 0-4-1.5-4-4 2 0 4 1.5 4 4z"/><path d="M12 13c2 0 4-1.5 4-4-2 0-4 1.5-4 4z"/><path d="M12 9c-1.5 0-3-1.2-3-3.2 1.5 0 3 1.2 3 3.2z"/><path d="M12 9c1.5 0 3-1.2 3-3.2-1.5 0-3 1.2-3 3.2z"/><circle cx="12" cy="12" r="10"/><path d="M5 5l14 14"/></svg></span>
            <div class="benefit-title" data-i18n="b2t"></div>
            <div class="benefit-body" data-i18n="b2"></div>
          </div>
          <div class="benefit" style="--card:#CDEFEA">
            <span class="benefit-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h9a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h8a3 3 0 0 1 0 6H9"/></svg></span>
            <div class="benefit-title" data-i18n="b3t"></div>
            <div class="benefit-body" data-i18n="b3"></div>
          </div>
          <div class="benefit" style="--card:#E3DCF7">
            <span class="benefit-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
            <div class="benefit-title" data-i18n="b4t"></div>
            <div class="benefit-body" data-i18n="b4"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. 판매처 + 카카오톡 -->
  <section class="stores-section">
    <div class="container">
      <div class="center">
        <h2 class="section-title yellow" data-i18n="storeTitle"></h2>
        <p class="lead on-teal" data-i18n="storeLead"></p>
      </div>
      <!-- 판매처는 js/main.js 의 STORES 배열에서 렌더링 -->
      <div class="stores" id="stores"></div>
      <!-- 문의 버튼: 링크는 data/links.json 에서 읽음. 값이 비어 있으면 버튼을 숨긴 채로 둔다 -->
      <div class="chat-wrap">
        <a class="chat-btn kakao-btn" data-link="kakao" target="_blank" rel="noopener" aria-label="KakaoTalk" hidden>
          <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.8 21l3.9-2.6c.8.1 1.5.2 2.3.2 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="#191919"/></svg>
        </a>
        <a class="chat-btn messenger-btn" data-link="messenger" target="_blank" rel="noopener" aria-label="Messenger" hidden>
          <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.4 2 2 6.1 2 11.6c0 2.9 1.2 5.4 3.2 7.1V22l2.9-1.6c1.2.3 2.5.5 3.9.5 5.6 0 10-4.1 10-9.4S17.6 2 12 2z" fill="#0A7CFF"/><path d="M6.4 14.6l3.4-5.3 2.8 2.1 3.1-2.1-3.4 5.3-2.8-2.1z" fill="#fff"/></svg>
        </a>      </div>
      <p class="chat-label" data-i18n="chatLabel"></p>
    </div>
  </section>

  <!-- 4. 04 Born in the Tropics 이미지 고정 -->
  <section class="tropics">
    <figure class="ad-frame">
      <img src="images/04-born-in-the-tropics.png" width="1080" height="1080" alt="BORN IN THE TROPICS. BUILT TO CRUNCH." loading="lazy">
    </figure>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <div class="footer-logo">Casava</div>
      <div data-i18n="footerTag"></div>
    </div>
    <div>
      <div class="footer-label" data-i18n="contactLabel"></div>
      <div>[PHONE]</div>
      <div>[EMAIL]</div>
    </div>
    <div>
      <div class="footer-label" data-i18n="addressLabel"></div>
      <div>[ADDRESS], Cebu, Philippines</div>
      <div class="footer-label spaced" data-i18n="inquiryLabel"></div>
      <div>[HOURS]</div>
    </div>
  </div>
  <div class="container copyright">© 2026 Casava. All rights reserved.</div>
</footer>

<a href="#top" class="to-top" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>TOP
</a>

<script src="js/main.js"></script>
</body>
</html>
